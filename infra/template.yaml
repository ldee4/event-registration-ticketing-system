AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Event Registration & Ticketing System - infrastructure template.
  Step 2: DynamoDB single-table data model.
  (Lambda functions and API Gateway resources will be added in later steps.)

Parameters:
  ProjectName:
    Type: String
    Default: EventRegistration
    Description: Prefix used to name resources consistently.

Resources:

  EventRegistrationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventRegistrationTable
      BillingMode: PAY_PER_REQUEST   # Free Tier friendly - no capacity planning needed
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  TableName:
    Description: Name of the DynamoDB table
    Value: !Ref EventRegistrationTable
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  TableArn:
    Description: ARN of the DynamoDB table (used later to scope the Lambda execution role)
    Value: !GetAtt EventRegistrationTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TableArn"
